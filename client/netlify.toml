# ==================================================
# 1. Redirect Netlify default domain → Custom domain
# ==================================================
[[redirects]]
  from = "https://bunchly.netlify.app/*"
  to = "https://bunchly.in/:splat"
  status = 301
  force = true

# ==================================================
# 2. Proxy sitemap to backend (SEO-safe)
# ==================================================
[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.bunchly.in/api/sitemap.xml"
  status = 200
  force = true

# ==================================================
# 3. Subdomain redirect (HARD REDIRECT)
# quasim.bunchly.in/* → bunchly.in/quasim
# ==================================================
[[redirects]]
  from = "/*"
  to = "https://bunchly.in/quasim"
  status = 301
  force = true
  conditions = { Host = ["quasim.bunchly.in"] }

# ==================================================
# 4. SPA fallback (MAIN DOMAIN ONLY)
# ==================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
