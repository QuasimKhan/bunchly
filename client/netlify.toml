# ==================================================
# 1. Redirect Netlify default domain → Custom domain
# ==================================================
[[redirects]]
  from = "https://bunchly.netlify.app/*"
  to = "https://bunchly.in/:splat"
  status = 301
  force = true

# ==================================================
# 2. Proxy sitemap to backend (SEO-safe)
# ==================================================
[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.bunchly.in/api/sitemap.xml"
  status = 200
  force = true

# ==================================================
# 3. Subdomain ROOT
# quasim.bunchly.in → /quasim
# ==================================================
[[redirects]]
  from = "/"
  to = "/quasim"
  status = 200
  force = true
  conditions = { Host = ["quasim.bunchly.in"] }

# ==================================================
# 4. Subdomain ALL PATHS
# quasim.bunchly.in/* → /quasim/*
# ==================================================
[[redirects]]
  from = "/*"
  to = "/quasim/:splat"
  status = 200
  force = true
  conditions = { Host = ["quasim.bunchly.in"] }

# ==================================================
# 5. SPA fallback (MUST BE LAST)
# ==================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
